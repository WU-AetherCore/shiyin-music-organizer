[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-organizer"
version = "1.3.14"
description = "本地音乐整理小插件：为树莓派本地音乐批量嵌入歌词与封面，支持 Web 管理与终端 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "WU" }]
keywords = ["music", "lyrics", "cover", "raspberry-pi", "tag", "lrc", "musicbrainz"]
dependencies = [
    "Flask>=3.0,<4",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "waitress>=3.0",
    "zhconv>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
morg = "music_organizer.cli:main"
music-organizer = "music_organizer.cli:main"

[tool.setuptools]
packages = ["music_organizer", "music_organizer.providers", "music_organizer.web"]

[tool.setuptools.package-data]
"music_organizer.web" = ["templates/*.html", "static/css/*.css", "static/js/*.js", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
