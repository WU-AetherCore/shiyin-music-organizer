<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d18">
  <title>登录 · 本地音乐整理小插件</title>
  <link rel="icon" href="/static/img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark brand-mark-lg">
        <img src="/static/img/icon.svg" alt="">
      </span>
      <div>
        <div class="auth-title">本地音乐整理小插件</div>
        <div class="auth-sub">MUSIC ORGANIZER · v{{ version }}</div>
      </div>
    </div>
    <p class="auth-hint">该管理界面已设置访问密码，请输入后继续。</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login{% if next %}?next={{ next|urlencode }}{% endif %}">
      <label class="field">
        <span>访问密码</span>
        <input type="password" name="password" autofocus autocomplete="current-password" placeholder="请输入密码">
      </label>
      <button class="btn btn-primary btn-block" type="submit">进入管理界面</button>
    </form>
    <p class="auth-foot">密码可在「设置 → Web 访问」中修改或关闭。</p>
  </main>
</body>
</html>
